# Producción en el VPS compartido (Oracle Linux, ARM64). Sin base de datos ni estado persistente:
# downloads/ vive dentro del contenedor y se autolimpia sola (ver src/app.py). Puerto local 8200
# para no chocar con Pagos (3101/4100), Mesa Digital (3001/4000), yabrio (3000) ni UCV-marcación.
# Ubicación en el servidor: /opt/universe-downloader/compose.prod.yml
#
# cookies/youtube.txt (formato Netscape, exportado del navegador con sesión en YouTube) es
# opcional y NUNCA vive en el repo: se coloca a mano en /opt/universe-downloader/cookies/ en el
# servidor. Sin él, yt-dlp sigue funcionando pero YouTube puede bloquear la IP del servidor con
# su verificación "Sign in to confirm you're not a bot" (ver src/services/downloader.py).
name: universe-downloader

services:
  app:
    image: ghcr.io/ipool23/universe-downloader:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8000"
    environment:
      # Opcional. Se aplica únicamente a YouTube cuando su rango de IP bloquea el VPS.
      - YOUTUBE_PROXY=${YOUTUBE_PROXY:-}
      # Perfil dedicado de YouTube. La app solo puede leerlo, nunca modificarlo.
      - YOUTUBE_BROWSER_PROFILE=/profiles/youtube
    volumes:
      - ./cookies:/app/cookies:ro
      - youtube_browser_profile:/profiles/youtube:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks: [downloader]

  # Se inicia solamente con `--profile youtube-login`, cuando haya que renovar la sesión.
  # No comparte perfil con UCV ni con ningún navegador personal.
  youtube-selenium:
    image: selenium/standalone-chrome:4.48.0-20260905
    profiles: [youtube-login]
    shm_size: 2gb
    ports:
      - "127.0.0.1:7902:7900"
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "false"
      # El puerto solo existe en loopback del VPS y se accede por un túnel SSH local.
      SE_VNC_NO_PASSWORD: "true"
    volumes:
      - youtube_browser_profile:/home/seluser/chrome-profile
    networks: [downloader]

  youtube-login:
    image: ghcr.io/ipool23/universe-downloader:${IMAGE_TAG:-latest}
    profiles: [youtube-login]
    depends_on:
      youtube-selenium:
        condition: service_started
    environment:
      SELENIUM_URL: http://youtube-selenium:4444/wd/hub
    command: ["python", "-m", "src.youtube_login"]
    networks: [downloader]

networks:
  downloader:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  youtube_browser_profile:
