# Producción en el VPS compartido (Oracle Linux, ARM64). Sin base de datos ni estado persistente:
# downloads/ vive dentro del contenedor y se autolimpia sola (ver src/app.py). Puerto local 8200
# para no chocar con Pagos (3101/4100), Mesa Digital (3001/4000), yabrio (3000) ni UCV-marcación.
# Ubicación en el servidor: /opt/universe-downloader/compose.prod.yml
name: universe-downloader

services:
  app:
    image: ghcr.io/ipool23/universe-downloader:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    networks: [downloader]

networks:
  downloader:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
