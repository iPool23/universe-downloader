name: mac

on:
  push:
    branches: [desktop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP: dist/Universe Downloader.app
      DATA: /Users/runner/Library/Application Support/UniverseDownloader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.20.0

      - name: FFmpeg y deno
        run: |
          python scripts/setup_ffmpeg.py
          python scripts/setup_deno.py
          ls -l mac/bin

      - name: Versión
        id: ver
        run: |
          V=$(python -c "import runpy; print(runpy.run_path('src/version.py')['APP_VERSION'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "zip=UniverseDownloader-$V-mac-arm64.zip" >> "$GITHUB_OUTPUT"

      - name: Compilar .app
        env:
          UNIVERSE_LITE_BUILD: "1"
        run: pyinstaller youtubedpl.spec --noconfirm

      - name: Revisar el paquete
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/UniverseDownloader"
          ls -l "$APP/Contents/Frameworks/bin"
          du -sh "$APP"
          plutil -p "$APP/Contents/Info.plist"

      - name: Diagnóstico de FFmpeg por HTTPS
        continue-on-error: true
        run: |
          FF="$APP/Contents/Frameworks/bin/ffmpeg"
          URL=https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.avi
          echo "--- sin SSL_CERT_FILE"; env -i HOME="$HOME" PATH=/usr/bin:/bin "$FF" -v error -t 1 -i "$URL" -f null - ; echo "código $?"
          echo "--- con SSL_CERT_FILE"; env -i HOME="$HOME" PATH=/usr/bin:/bin SSL_CERT_FILE=/etc/ssl/cert.pem "$FF" -v error -t 1 -i "$URL" -f null - ; echo "código $?"
          echo "--- sin verificar"; env -i HOME="$HOME" PATH=/usr/bin:/bin "$FF" -v error -tls_verify 0 -t 1 -i "$URL" -f null - ; echo "código $?"

      - name: Autotest del .app
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin TMPDIR="$TMPDIR" "$APP/Contents/MacOS/UniverseDownloader" --selftest || true
          cat "$DATA/selftest.txt"
          grep -q "^Listo" "$DATA/selftest.txt"

      - name: Ventana, descargas, conversiones y actualización
        run: python scripts/probar_mac.py "$APP" dist/pruebas

      - name: Registro de la app
        if: always()
        run: tail -n 200 "$DATA/app.log" || true

      - name: La app no escribió dentro de su paquete
        run: codesign --verify --deep --strict "$APP"

      - name: Empaquetar
        run: |
          ditto -c -k --keepParent "$APP" "dist/${{ steps.ver.outputs.zip }}"
          shasum -a 256 "dist/${{ steps.ver.outputs.zip }}"
          ls -lh dist/*.zip

      - name: Guardar las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-mac
          path: dist/pruebas
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar el zip
        uses: actions/upload-artifact@v4
        with:
          name: UniverseDownloader-mac-arm64
          path: dist/${{ steps.ver.outputs.zip }}
          if-no-files-found: error
          retention-days: 14
